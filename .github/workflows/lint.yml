name: .NET Lint

on:
  push:
    branches:
      - erkys-features
      - feature/missinginmaster
  pull_request:
    branches: [main]

env:
  TML_VERSION: v2026.08.3.0
  Configuration: Release

jobs:
  dotnet-lint:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check dependency token
        shell: pwsh
        env:
          DEPENDENCIES_READ_TOKEN: ${{ secrets.DEPENDENCIES_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPENDENCIES_READ_TOKEN)) {
            throw "Set DEPENDENCIES_READ_TOKEN with Contents read access to the private PylonTeam dependency repositories."
          }

      - name: Checkout PvPAdventure
        uses: actions/checkout@v6
        with:
          path: PvPAdventure

      - name: Checkout PvPFramework
        uses: actions/checkout@v6
        with:
          repository: PylonTeam/PvPFramework
          ref: 1caaee17a32669790a33ab83f6c300067e33df5f
          token: ${{ secrets.DEPENDENCIES_READ_TOKEN }}
          persist-credentials: false
          path: PvPFramework

      - name: Checkout Pylon
        uses: actions/checkout@v6
        with:
          repository: PylonTeam/Pylon
          ref: 41373ec0cc21c98b4828fa29a56a4c0cf22b0a51
          token: ${{ secrets.DEPENDENCIES_READ_TOKEN }}
          persist-credentials: false
          path: Pylon

      - name: Checkout ErkySSC
        uses: actions/checkout@v6
        with:
          repository: PylonTeam/ErkySSC
          ref: a17d7d25de9c6b4317ea8e167ad26c35f33ddd5c
          token: ${{ secrets.DEPENDENCIES_READ_TOKEN }}
          persist-credentials: false
          path: ErkySSC

      - name: Verify dependency revisions
        shell: pwsh
        run: |
          Write-Host "PvPAdventure: $(git -C PvPAdventure rev-parse HEAD)"
          Write-Host "PvPFramework: $(git -C PvPFramework rev-parse HEAD)"
          Write-Host "Pylon: $(git -C Pylon rev-parse HEAD)"
          Write-Host "ErkySSC: $(git -C ErkySSC rev-parse HEAD)"

      - name: Download tModLoader
        shell: pwsh
        run: |
          $url = "https://github.com/tModLoader/tModLoader/releases/download/$env:TML_VERSION/tModLoader.zip"
          curl.exe --fail --location --silent --show-error $url -o tModLoader.zip
          if ($LASTEXITCODE -ne 0) { throw "Failed to download tModLoader." }

      - name: Extract tModLoader
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath tModLoader.zip -DestinationPath tModLoader -Force
          Remove-Item -LiteralPath tModLoader.zip
          if (!(Test-Path "tModLoader\tMLMod.targets")) {
            throw "tMLMod.targets was not found after extracting tModLoader."
          }

      - name: Create tModLoader.targets
        shell: pwsh
        run: |
          @'
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="tModLoader\tMLMod.targets" />
          </Project>
          '@ | Set-Content -LiteralPath tModLoader.targets -Encoding utf8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        working-directory: PvPAdventure
        run: dotnet restore PvPAdventure.csproj -p:Configuration=Release --disable-parallel -m:1 -nr:false

      - name: Lint
        working-directory: PvPAdventure
        run: dotnet format style PvPAdventure.csproj --verify-no-changes --no-restore
